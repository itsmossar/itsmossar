<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">Gabriel Mendoza Escobar observatory interface</title>
  <desc id="description">A dark scientific interface with an orbital system, stars, and the Heisenberg uncertainty principle.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101c"/>
      <stop offset="0.58" stop-color="#0b1727"/>
      <stop offset="1" stop-color="#10152a"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#75c7ef" stop-opacity=".22"/>
      <stop offset="1" stop-color="#75c7ef" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#88b7d0" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="440" rx="18" fill="url(#space)"/>
  <rect width="1200" height="440" rx="18" fill="url(#grid)"/>
  <path d="M0 344C195 293 330 371 536 332S865 272 1200 335V440H0Z" fill="#07101c" fill-opacity=".34"/>
  <g fill="#d9f3ff">
    <circle cx="76" cy="76" r="1.1"><animate attributeName="opacity" values=".25;1;.25" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="177" cy="132" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="327" cy="49" r="1" opacity=".7"/>
    <circle cx="434" cy="105" r="1.25"><animate attributeName="opacity" values=".2;.9;.2" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="764" cy="73" r="1.2" opacity=".72"/>
    <circle cx="1078" cy="91" r="1.6"><animate attributeName="opacity" values=".3;1;.3" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="1141" cy="275" r="1.1" opacity=".8"/>
    <circle cx="904" cy="371" r="1" opacity=".6"/>
  </g>
  <g transform="translate(928 215)">
    <circle r="152" fill="url(#halo)"/>
    <g fill="none" stroke="#76c8ee" stroke-opacity=".36">
      <ellipse rx="168" ry="69" stroke-width="1"/>
      <ellipse rx="98" ry="151" transform="rotate(42)" stroke-width="1"/>
      <circle r="93" stroke-dasharray="3 8" stroke-width="1"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
      <circle cx="166" r="4" fill="#8cd6f5" filter="url(#glow)"/>
      <circle cx="-54" cy="-134" r="2.5" fill="#bcdfff"/>
    </g>
    <circle r="29" fill="#132c45" stroke="#8bd4f4" stroke-opacity=".7"/>
    <circle r="12" fill="#8bd4f4" filter="url(#glow)"><animate attributeName="r" values="10;13;10" dur="4s" repeatCount="indefinite"/></circle>
    <path d="M-185 14H-34" stroke="#9fdcf5" stroke-opacity=".5" stroke-width="1" stroke-dasharray="5 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#c7d3dc" font-family="Inter, Geist, Arial, sans-serif">
    <text x="72" y="82" font-size="12" letter-spacing="3.2" fill="#87c8e5">ENGINEERING OBSERVATORY / AI-01</text>
    <text x="72" y="139" font-size="18" letter-spacing="1.8" fill="#90a6b7">BUILDING INTELLIGENT SYSTEMS</text>
    <text x="72" y="208" font-size="46" font-weight="600" letter-spacing="-1.2" fill="#f2f7fa">Gabriel Mendoza Escobar</text>
    <text x="75" y="249" font-size="17" letter-spacing=".4">Full-Stack Engineer / AI Engineer / Data Scientist</text>
    <text x="75" y="276" font-size="17" letter-spacing=".4">from raw signal to resilient, intelligent products.</text>
    <text x="74" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8ed1ee">Δx · Δp ≥ ħ / 2</text>
    <text x="74" y="382" font-size="12" letter-spacing="2.1" fill="#6f91a5">MEASUREMENT CHANGES THE MODEL</text>
  </g>
  <path d="M73 304H516" stroke="#7ac8eb" stroke-opacity=".36"/>
  <circle cx="515" cy="304" r="3" fill="#91d6f2"><animate attributeName="opacity" values=".25;1;.25" dur="3.7s" repeatCount="indefinite"/></circle>
</svg>
