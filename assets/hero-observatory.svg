<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title description">
  <title id="title">Gabriel Mendoza AI engineering observatory</title>
  <desc id="description">A living observatory scene showing data, models, software systems, and an orbital AI core.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050b14"/><stop offset=".5" stop-color="#0a1a2c"/><stop offset="1" stop-color="#10162d"/></linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#b4edff"/><stop offset=".22" stop-color="#61c7ef"/><stop offset=".6" stop-color="#1b5278"/><stop offset="1" stop-color="#102039"/></radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#13263a" stop-opacity=".92"/><stop offset="1" stop-color="#091521" stop-opacity=".72"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#9bdff8" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1200" height="540" rx="22" fill="url(#sky)"/>
  <rect width="1200" height="540" rx="22" fill="url(#grid)"/>
  <g fill="#d4f4ff">
    <circle cx="68" cy="72" r="1.3"><animate attributeName="opacity" values=".2;1;.2" dur="4.4s" repeatCount="indefinite"/></circle><circle cx="204" cy="113" r="1" opacity=".72"/><circle cx="380" cy="64" r="1.6"><animate attributeName="opacity" values="1;.25;1" dur="6s" repeatCount="indefinite"/></circle><circle cx="529" cy="99" r="1" opacity=".6"/><circle cx="711" cy="50" r="1.2" opacity=".75"/><circle cx="1095" cy="93" r="1.5"><animate attributeName="opacity" values=".25;1;.25" dur="5s" repeatCount="indefinite"/></circle><circle cx="1139" cy="405" r="1.1" opacity=".8"/>
  </g>
  <g transform="translate(904 262)">
    <circle r="212" fill="#58bde8" opacity=".06"/><circle r="166" fill="#58bde8" opacity=".05"/>
    <g fill="none" stroke="#7ed3f2"><ellipse rx="232" ry="91" stroke-opacity=".36"/><ellipse rx="116" ry="205" transform="rotate(37)" stroke-opacity=".24"/><circle r="132" stroke-opacity=".28" stroke-dasharray="3 10"/></g>
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/><circle cx="231" r="5" fill="#9de5ff" filter="url(#glow)"/><circle cx="-84" cy="-147" r="3" fill="#bdeeff"/></g>
    <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/><circle cx="-117" cy="-20" r="3.5" fill="#87cfee"/></g>
    <circle r="79" fill="url(#core)" stroke="#b7edff" stroke-opacity=".54"/><path d="M-77 12C-28-3 25-2 77 14M-60-31C-16-45 23-43 60-25" fill="none" stroke="#d7f7ff" stroke-opacity=".32"/>
    <circle r="17" fill="#d2f6ff" filter="url(#glow)"><animate attributeName="r" values="14;20;14" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="Inter, Geist, Arial, sans-serif">
    <text x="72" y="78" fill="#88d3f2" font-size="12" letter-spacing="3">GABRIEL MENDOZA ESCOBAR / SIGNAL LAB</text>
    <text x="72" y="147" fill="#f0f8fc" font-size="45" font-weight="600">Engineering intelligence</text>
    <text x="72" y="194" fill="#f0f8fc" font-size="45" font-weight="600">from data to orbit.</text>
    <text x="74" y="238" fill="#aabcc7" font-size="18">Full-Stack Engineer · AI Engineer · Data Scientist</text>
    <text x="74" y="269" fill="#7e9aaa" font-size="15">systems, models, signal processing, and products that hold under load</text>
  </g>
  <g transform="translate(72 319)" font-family="Inter, Geist, Arial, sans-serif">
    <rect width="468" height="136" rx="13" fill="url(#panel)" stroke="#82d4f1" stroke-opacity=".23"/>
    <text x="25" y="31" fill="#86cdea" font-size="11" letter-spacing="2.1">CURRENT MISSION</text>
    <text x="25" y="65" fill="#e6f2f7" font-size="20">Build software that makes</text>
    <text x="25" y="91" fill="#e6f2f7" font-size="20">intelligent decisions reliable.</text>
    <path d="M25 111H428" stroke="#7ecfeb" stroke-opacity=".3"/><circle cx="426" cy="111" r="4" fill="#91dcf7"><animate attributeName="opacity" values=".2;1;.2" dur="2.7s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(72 487)" fill="#8ba5b5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <text>DATA -&gt; REPRESENTATION -&gt; INFERENCE -&gt; IMPACT</text>
  </g>
  <path d="M0 501C212 458 333 543 544 502S907 458 1200 514V540H0Z" fill="#030810" fill-opacity=".53"/>
</svg>
